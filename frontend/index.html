<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anonymous Random Chat</title>

    <!-- TailwindCSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.7/dist/tailwind.min.css"
      rel="stylesheet"
    />

    <!-- Socket.io served from backend -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Our app script -->
    <script defer src="script.js"></script>
  </head>

  <body
    class="h-screen bg-gradient-to-br from-gray-900 via-black to-gray-800 flex items-center justify-center"
  >
    <div
      class="w-full max-w-3xl h-[90vh] backdrop-blur-xl bg-gray-900/60 border border-gray-700/40 rounded-3xl shadow-2xl flex flex-col overflow-hidden"
    >
      <!-- Header -->
      <div
        class="flex items-center justify-between px-6 py-4 bg-gray-900/80 border-b border-gray-700/40"
      >
        <div>
          <h2 class="text-xl font-bold text-white tracking-wide">
            Random Chat
          </h2>
          <p class="text-gray-300 text-xs opacity-70">
            Chat anonymously with strangers in real time
          </p>
        </div>

        <div
          id="username-badge"
          class="px-4 py-1 bg-indigo-600 text-white rounded-full text-xs shadow-md"
        >
          ...
        </div>
      </div>

      <!-- Messages -->
      <div
        id="messages"
        class="flex-1 px-6 py-4 overflow-y-auto space-y-3 scroll-smooth"
      ></div>

      <!-- Typing indicator -->
      <div
        id="typing-indicator"
        class="px-6 pb-1 text-xs text-gray-400 italic hidden"
      >
        Someone is typing…
      </div>

      <!-- Input -->
      <form
        id="chat-form"
        class="px-6 py-4 flex items-center gap-3 bg-gray-900/80 border-t border-gray-700/40"
      >
        <input
          id="message-input"
          type="text"
          placeholder="Type a message..."
          autocomplete="off"
          class="flex-1 bg-gray-800/70 text-black placeholder-gray-400 px-4 py-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm"
        />

        <button
          class="bg-indigo-600 hover:bg-indigo-700 transition-all text-white px-5 py-3 rounded-2xl font-semibold shadow-lg text-sm"
        >
          Send
        </button>
      </form>
    </div>
  </body>
</html>
